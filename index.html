<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRST WEBSITE LAYOUT</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="main-page">
        <header class="main-page__header">
            <img class="header__banner" src="img/banner-mobile.jpg" alt="Изображение йоги на фоне гор">
            <img class="header__logo" src="svg/noemi-logo.svg" alt="Логотип">
            <div class="header__intro-wrapper">
                <h1 class="intro">
                    Блог о творчестве, спорте, и образе жизни
                </h1>
            </div>
        </header>
        <footer class="main-page__footer">
            <div class="social-media">
                <img class="dribble-logo" src="svg/001-dribbble.svg" alt="dribble">
                <img class="pinterest-logo" src="svg/001-pinterest.svg" alt="pinterest">
                <img class="tumblr-logo" src="svg/003-tumblr.svg" alt="tumblr">
            </div>
            <div class="copyright-wrapper">
                <span class="copyright">
                    Copyright 2009-2019 City Blog LLC.
                </span>
            </div>

        </footer>

    </div>
</body>


</html>
